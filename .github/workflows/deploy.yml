name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: |
        cd frontend
        npm install --legacy-peer-deps
    
    - name: Build frontend
      run: |
        cd frontend
        npm run build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: frontend-dist
        path: frontend/dist

  build-backend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, pdo, pdo_mysql, xml, gd, zip
    
    - name: Copy .env
      run: |
        cd backend
        cp .env.example .env
    
    - name: Install dependencies
      run: |
        cd backend
        composer install --no-interaction --prefer-dist --optimize-autoloader
    
    - name: Generate app key
      run: |
        cd backend
        php artisan key:generate --ansi
      continue-on-error: true
    
    - name: Test backend
      run: |
        cd backend
        php artisan config:cache
      continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker images
      run: |
        docker build -t form-builder:latest .
      continue-on-error: true
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      continue-on-error: true
    
    - name: Push Docker images
      run: |
        docker tag form-builder:latest ${{ secrets.DOCKER_USERNAME }}/form-builder:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/form-builder:latest
      continue-on-error: true

  deploy:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Deploy to Railway
      run: echo "Deployment would happen here"
      continue-on-error: true

